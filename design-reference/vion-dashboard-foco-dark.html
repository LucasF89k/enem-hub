<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vion — Foco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0A10;
    --card:#171229;
    --violet:#8B5CF6;
    --violet-soft:#241A3D;
    --green:#22C55E;
    --ink:#F4F2FA;
    --muted:#8A8496;
    --line:#241F33;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);font-family:'Sora',sans-serif;display:flex;justify-content:center;padding:30px 0;}

  .phone{width:390px;background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,0.5);min-height:760px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:26px 28px 0;}
  .topbar .date{font-size:12.5px;color:var(--muted);font-weight:400;letter-spacing:0.03em;}
  .avatar-sm{width:30px;height:30px;border-radius:50%;background:var(--violet-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--violet);}

  .level-badge{display:flex;align-items:center;gap:10px;}
  .level-ring{
    position:relative;width:34px;height:34px;border-radius:50%;
    background:conic-gradient(var(--violet) 62%, var(--line) 0);
    display:flex;align-items:center;justify-content:center;
  }
  .level-ring span{
    width:27px;height:27px;border-radius:50%;background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:500;color:var(--violet);
  }
  .level-text p{font-size:9.5px;color:var(--muted);font-weight:400;letter-spacing:0.03em;line-height:1.2;}
  .level-text .xp{font-size:12.5px;color:var(--ink);font-weight:400;}

  .content{padding:8px 32px 40px;display:flex;flex-direction:column;align-items:center;}

  .greet{text-align:center;margin:28px 0 6px;}
  .greet h1{font-weight:300;font-size:19px;color:var(--ink);letter-spacing:0.01em;}
  .greet h1 b{font-weight:500;}

  /* focus ring — signature element */
  .ring-wrap{position:relative;width:230px;height:230px;margin:26px 0 8px;}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-center{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .ring-center .num{font-size:40px;font-weight:300;color:var(--ink);line-height:1;}
  .ring-center .num span{font-size:17px;color:var(--muted);font-weight:300;}
  .ring-center .lbl{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:0.04em;}

  .next-task{text-align:center;margin:22px 0 26px;}
  .next-task .eyebrow{font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;}
  .next-task h2{font-size:19px;font-weight:400;color:var(--ink);margin-bottom:4px;}
  .next-task p{font-size:13px;color:var(--muted);}

  .btn-begin{
    font-family:'Sora',sans-serif;font-weight:500;font-size:14px;color:#fff;
    background:var(--violet);border:none;
    padding:15px 42px;border-radius:100px;cursor:pointer;
    letter-spacing:0.02em;
  }

  .divider-line{width:100%;height:1px;background:var(--line);margin:36px 0 26px;}

  .quiet-stats{display:flex;justify-content:space-between;width:100%;}
  .qstat{text-align:center;flex:1;}
  .qstat .v{font-size:20px;font-weight:400;color:var(--ink);}
  .qstat .v.violet{color:var(--violet);}
  .qstat .v.green{color:var(--green);}
  .qstat .l{font-size:11px;color:var(--muted);margin-top:3px;}
  .qsep{width:1px;background:var(--line);margin:2px 0;}

  .trail-note{
    margin-top:30px;text-align:center;
    font-size:12.5px;color:var(--muted);line-height:1.6;max-width:260px;
  }
  .trail-note b{color:var(--violet);font-weight:500;}
</style>
</head>
<body>

<div class="phone">

  <div class="topbar">
    <div class="level-badge">
      <div class="level-ring"><span>12</span></div>
      <div class="level-text">
        <p>nível</p>
        <p class="xp">1.240 XP</p>
      </div>
    </div>
    <div class="avatar-sm">LF</div>
  </div>

  <div style="padding:16px 28px 0;">
    <span class="date">domingo, 28 de junho</span>
  </div>

  <div class="content">

    <div class="greet">
      <h1>Olá, <b>Lucas</b></h1>
    </div>

    <div class="ring-wrap">
      <svg viewBox="0 0 230 230">
        <circle cx="115" cy="115" r="100" fill="none" stroke="#241F33" stroke-width="10"/>
        <circle cx="115" cy="115" r="100" fill="none" stroke="#8B5CF6" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="628" stroke-dashoffset="628"/>
      </svg>
      <div class="ring-center">
        <p class="num">0<span>/270 min</span></p>
        <p class="lbl">estudados hoje</p>
      </div>
    </div>

    <div class="next-task">
      <p class="eyebrow">Um passo de cada vez</p>
      <h2>Genética — Leis de Mendel</h2>
      <p>Teoria · 25 minutos</p>
    </div>

    <button class="btn-begin">Começar agora</button>

    <div class="divider-line"></div>

    <div class="quiet-stats">
      <div class="qstat">
        <p class="v">0</p>
        <p class="l">sequência</p>
      </div>
      <div class="qsep"></div>
      <div class="qstat">
        <p class="v green">860</p>
        <p class="l">nota estimada</p>
      </div>
      <div class="qsep"></div>
      <div class="qstat">
        <p class="v violet">104</p>
        <p class="l">dias p/ ENEM</p>
      </div>
    </div>

    <p class="trail-note">Você está na trilha <b>intensiva</b> — o plano de hoje prioriza prática sobre teoria.</p>

  </div>
</div>

</body>
</html>
